name: Update GitHub Stats

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch GitHub statistics
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: python src/fetch_stats.py

      - name: Render SVG from stats
        run: python src/render_stats.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add stats.svg stats.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update GitHub stats [skip ci]" && git push)
